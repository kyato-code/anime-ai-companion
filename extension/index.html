<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hikari - Anime AI Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="status" id="status" title="Menghubungkan ke backend...">
        <span class="dot" id="status-dot"></span>
        <strong>Hikari</strong>
        <small id="status-text">Menghubungkan...</small>
      </div>
      <button id="reset-btn" class="icon-btn" type="button"
              title="Mulai obrolan baru" aria-label="Mulai obrolan baru">&#x21BA;</button>
    </header>

    <section class="character-card" aria-hidden="true">
      <img id="bg-cat" src="assets/cat.jpg" alt="">
      <canvas id="eye-canvas"></canvas>
    </section>

    <section id="chat-history" role="log" aria-live="polite" aria-label="Riwayat obrolan"></section>

    <div id="chat-input-area">
      <input type="text" id="user-input" maxlength="2000" autocomplete="off"
             placeholder="Ketik pesan untuk Hikari..." aria-label="Pesan">
      <button id="send-btn" type="button">Kirim</button>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
