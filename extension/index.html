<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Anime AI Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="companion-container">
    <div id="avatar-container">
      <div class="character-card">
        <img id="bg-cat" src="assets/cat.jpg" alt="Cat Companion" />
        <canvas id="eye-canvas"></canvas>
      </div>
    </div>

    <!-- Chat Box UI -->
    <div id="chat-history">
      <div class="message bot-message">
        <span>Halo! Aku siap nemenin kamu browsing dan cari info apa aja hari ini! ☕✨</span>
      </div>
    </div>

    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan untuk Kucing..." />
      <button id="send-btn">Kirim</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
