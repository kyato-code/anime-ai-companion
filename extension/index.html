<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Anime AI Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="companion-container">
    <!-- Area Karakter Anime -->
    <div id="avatar-container">
      <img id="character-img" src="https://images.fineartamerica.com/images/interactive/png/anime-character.png" alt="Hikari" />
    </div>

    <!-- Area Balasan Chat Bubble -->
    <div id="chat-history">
      <div class="message bot-message">
        <span>Konnichiwa! Aku Hikari. Ada yang bisa kubantu hari ini?</span>
      </div>
    </div>

    <!-- Input Box -->
    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan untuk Hikari..." />
      <button id="send-btn">Kirim</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
