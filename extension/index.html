<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Anime AI Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="companion-container">
    <div id="avatar-container">
      <div class="image-wrapper">
        <img id="character-img" src="assets/cat.jpg" alt="Cat Companion" />
        <div class="steam steam-1"></div>
        <div class="steam steam-2"></div>
      </div>
    </div>

    <div id="chat-history">
      <div class="message bot-message">
        <span>Meow! Aku siap nemenin kamu ngoding dan jawab pertanyaanmu! ☕</span>
      </div>
    </div>

    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan..." />
      <button id="send-btn">Kirim</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
