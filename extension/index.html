<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Anime AI Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="companion-container">
    <div id="avatar-container">
      <!-- Karakter Kucing SVG Interaktif -->
      <svg id="cat-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Telinga -->
        <path d="M 50 110 Q 30 30 100 60 Z" fill="#fff5f5" stroke="#4a3b32" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 250 110 Q 270 30 200 60 Z" fill="#fff5f5" stroke="#4a3b32" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 60 100 Q 45 50 90 70 Z" fill="#ffb7c5" opacity="0.6"/>
        <path d="M 240 100 Q 255 50 210 70 Z" fill="#ffb7c5" opacity="0.6"/>

        <!-- Kepala Kucing -->
        <path d="M 50 120 C 30 220 270 220 250 120 C 250 50 50 50 50 120 Z" fill="#fff5f5" stroke="#4a3b32" stroke-width="6"/>

        <!-- Pipih Merah Muda -->
        <ellipse cx="85" cy="155" rx="15" ry="8" fill="#ffb7c5" opacity="0.7"/>
        <ellipse cx="215" cy="155" rx="15" ry="8" fill="#ffb7c5" opacity="0.7"/>

        <!-- Mata Kiri & Pupil (Ikut Mouse) -->
        <g id="left-eye">
          <ellipse cx="105" cy="135" rx="14" ry="18" fill="#4a3b32"/>
          <ellipse id="pupil-left" cx="105" cy="135" rx="6" ry="8" fill="#ffffff"/>
        </g>

        <!-- Mata Kanan & Pupil (Ikut Mouse) -->
        <g id="right-eye">
          <ellipse cx="195" cy="135" rx="14" ry="18" fill="#4a3b32"/>
          <ellipse id="pupil-right" cx="195" cy="135" rx="6" ry="8" fill="#ffffff"/>
        </g>

        <!-- Hidung & Mulut Interaktif -->
        <path d="M 146 150 Q 150 154 154 150 Q 150 146 146 150 Z" fill="#4a3b32"/>
        <path id="cat-mouth" d="M 138 156 Q 144 162 150 156 Q 156 162 162 156" fill="none" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>

        <!-- Kumis -->
        <line x1="40" y1="140" x2="70" y1="145" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>
        <line x1="35" y1="155" x2="68" y1="155" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>
        <line x1="40" y1="170" x2="70" y1="165" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>

        <line x1="260" y1="140" x2="230" y1="145" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>
        <line x1="265" y1="155" x2="232" y1="155" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>
        <line x1="260" y1="170" x2="230" y1="165" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Chat Box UI -->
    <div id="chat-history">
      <div class="message bot-message">
        <span>Meow! Coba gerakkan mouselu di sekitar mukaku! ☕</span>
      </div>
    </div>

    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan..." />
      <button id="send-btn">Kirim</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
